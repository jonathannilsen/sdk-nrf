sample:
  name: IronSide SE firmware update using SMP Server
  description: >
    Demonstrates updating IronSide SE firmware over UART using a custom
    MCUmgr command group registered on top of the SMP server.
tests:
  sample.ironside_se.smp_svr:
    build_only: true
    integration_platforms:
      - nrf54h20dk/nrf54h20/cpuapp
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    tags:
      - ci_build
